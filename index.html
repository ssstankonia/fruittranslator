<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fruit Translator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 20px;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
    }
    main { width: 100%; max-width: 620px; margin: 0 auto; }
    h1 { margin: 0 0 28px; font-size: 30px; font-weight: 700; letter-spacing: -1px; }
    label {
      display: block; margin: 0 0 9px; font-size: 13px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
    }
    textarea, .output {
      display: block; width: 100%; min-height: 125px; padding: 14px;
      border: 2px solid #000; border-radius: 0; background: #fff; color: #000;
      font: inherit; font-size: 16px; line-height: 1.6; overflow-wrap: anywhere;
    }
    textarea { resize: vertical; outline-offset: 3px; }
    .output { white-space: pre-wrap; }
    .section { margin-bottom: 22px; }
    .hint { margin-top: 8px; color: #444; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Fruit Translator</h1>
    <div class="section">
      <label for="inputText">Your text</label>
      <textarea id="inputText" placeholder="Type something here..."></textarea>
      <div class="hint">Your words stay the same, with extra phrases mixed in.</div>
    </div>
    <div class="section">
      <label for="outputText">Translation</label>
      <div class="output" id="outputText" aria-live="polite"></div>
    </div>
  </main>

  <script>
    const input = document.getElementById('inputText');
    const output = document.getElementById('outputText');
    const phrases = [
      "i guess bro",
      "like that post i saw on x"
    ];

    function translate(text) {
      const words = text.match(/\S+/g) || [];
      if (words.length === 0) return "";

      // Keep the original words and insert a phrase between them at intervals.
      const result = [];
      words.forEach((word, index) => {
        result.push(word);
        if ((index + 1) % 3 === 0 && index < words.length - 1) {
          result.push(phrases[(Math.floor(index / 3)) % phrases.length]);
        }
      });

      // For short text, still show a phrase after the typed text.
      if (words.length < 3) result.push(phrases[0]);
      return result.join(" ");
    }

    input.addEventListener('input', () => {
      output.textContent = translate(input.value);
    });
  </script>
</body>
</html>
